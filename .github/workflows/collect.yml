name: DART 공시 수집

on:
  schedule:
    # GitHub는 UTC 기준. 평일 07:00, 12:30, 18:30 (한국시간)
    - cron: "0 22 * * 0-4"
    - cron: "30 3 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "최근 며칠치 공시를 조회할까요? (처음 실행 시 60 권장)"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: dart-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r collector/requirements.txt

      - name: DART 수집 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '10' }}
        run: python collector/collect_dart.py

      - name: 변경된 데이터 저장
        run: |
          git config user.name "dart-bot"
          git config user.email "dart-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "새로 바뀐 공시가 없습니다."
          else
            git commit -m "DART 데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
